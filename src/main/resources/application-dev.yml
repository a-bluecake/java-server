server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/0813-demo?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # 服务器ip
      host: 127.0.0.1
      # redis端口号
      port: 6379
      # redis密码
      password: 123456
      # redis数据库索引（从0开始）
      database: 0
      timeout: 10s
      lettuce:
        pool:
          max-active: 200
          max-wait: 3000ms
          max-idle: 10
          min-idle: 0

